defaults:
  - SimToolRealConnectomeSAPG
  - _self_

params:
  network:
    connectome:
      adaptation:
        weight_mode: low_rank
        learn_dynamics: false
      spectral_monitoring:
        enabled: true
        interval: 100
        top_k: 8
      spectral_preconditioning:
        enabled: false
        alpha: 0.0
        singular_value_floor_ratio: 1.0e-3
        refresh_every_ppo_updates: 1
      plasticity_monitoring:
        enabled: true
        interval: 100
  config:
    name: ${resolve_default:SimToolRealConnectomeLowRankSAPG,${....experiment}}
