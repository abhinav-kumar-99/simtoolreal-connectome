# Fresh K=2 adaptive-LR replacement with one-third of the standard LR bounds.
schema_version: 1
name: ppo_fly1952_k2_adaptive_lr_third_bounds_100b
stages: [prepare, train]
output_directory: train_dir/connectome/cycle_ablation/ppo_fly1952_k2_adaptive_lr_third_bounds_100b
runtime_environment:
  CC: /usr/bin/gcc
  CXX: /usr/bin/g++
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
preparation:
  config: configs/connectome/malecns_1952.yaml
training:
  task_profile: SimToolRealLSTMAsymmetric
  train_profiles:
    - name: fly1952_k2_adaptive_lr_third_bounds
      train_profile: SimToolRealConnectome1952AdaptersMLP128x32x32AllNeuronReadoutGaussianSigma3SAPG
      overrides:
        ++train.params.network.connectome.dynamics.neural_updates: 2
  seeds: [42]
  gpu_assignments: [0]
  max_parallel: 1
  num_envs: 12288
  sapg_block_size: 2048
  epochs: 508626
  max_frames: 100000000000
  minibatch_size: 49152
  central_critic_minibatch_size: 49152
  rollout_accumulation_steps: 1
  actor_microbatch_size: 49152
  central_critic_microbatch_size: 49152
  inference_checkpoint_interval_frames: 250000000
  save_frequency: 200
  save_best_after: 100
  on_existing: fail
  checkpoint: {mode: none, path: ''}
  wandb:
    enabled: false
    project: simtoolreal-connectome
    entity: ''
    group: fly1952-k2-adaptive-lr-third-bounds
    tags: [fly-1952, k2, cycle-ablation, adaptive-lr, third-lr-bounds, asymmetric-central-critic, no-actor-value-loss, mlp-128x32x32, clipped-gaussian, sigma-3, leader-follower, entropy-1x]
  overrides:
    train.params.config.learning_rate: 0.0001
    train.params.config.lr_schedule: adaptive
    train.params.config.schedule_type: rollout
    train.params.config.min_lr: 3.333333333333333e-7
    train.params.config.max_lr: 0.0003333333333333333
    train.params.config.central_value_config.learning_rate: 0.0001
    train.params.config.kl_threshold: 0.004
    train.params.config.use_others_experience: lf
    train.params.config.off_policy_ratio: 1.0
    ++train.params.config.use_experimental_cv: false
    ++task.env.useSparseReward: false
    task.env.objectScaleNoiseMultiplierRange: [0.9, 1.1]
    task.env.forceConsecutiveNearGoalSteps: true
    train.params.config.expl_reward_coef_scale: 0.005
    task.env.forceScale: 2.0
    task.env.forceProbRange: [0.001, 0.1]
    task.env.forceDecay: 0.99
    task.env.forceDecayInterval: 0.08
    task.env.forceOnlyWhenLifted: true
    task.env.torqueScale: 0.0
    task.env.linVelImpulseScale: 0.0
    task.env.angVelImpulseScale: 0.0
    task.env.objectAngVelPenaltyScale: 0.0
    task.env.goodResetBoundary: 0
    train.params.config.good_reset_boundary: 0
