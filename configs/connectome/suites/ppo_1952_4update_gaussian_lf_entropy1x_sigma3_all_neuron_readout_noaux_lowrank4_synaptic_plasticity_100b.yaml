# Historical all-neuron noaux contract with rank-4 existing-edge synaptic plasticity.
schema_version: 1
name: ppo_1952_4update_gaussian_lf_entropy1x_sigma3_all_neuron_readout_noaux_lowrank4_synaptic_plasticity_100b
stages: [prepare, train]
output_directory: train_dir/connectome/adaptation_100b_gains_update_timing/ppo_1952_4update_gaussian_lf_entropy1x_sigma3_all_neuron_readout_noaux_lowrank4_synaptic_plasticity_100b
runtime_environment:
  CC: /usr/bin/gcc
  CXX: /usr/bin/g++
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
preparation:
  config: configs/connectome/malecns_1952.yaml
training:
  task_profile: SimToolRealLSTMAsymmetric
  train_profiles:
    - name: gaussian_lf_entropy1x_sigma3_all_neurons_noaux_lowrank4_synaptic_plasticity
      train_profile: SimToolRealConnectome1952AdaptersMLPAllNeuronReadoutGaussianSigma3SAPG
      overrides:
        train.params.network.connectome.adaptation.weight_mode: low_rank
        train.params.network.connectome.adaptation.rank: 4
        train.params.network.connectome.adaptation.learn_dynamics: false
  seeds: [42]
  gpu_assignments: [0]
  max_parallel: 1
  num_envs: 12288
  sapg_block_size: 2048
  epochs: 508626
  max_frames: 100000000000
  minibatch_size: 49152
  central_critic_minibatch_size: 49152
  rollout_accumulation_steps: 1
  actor_microbatch_size: 49152
  central_critic_microbatch_size: 49152
  inference_checkpoint_interval_frames: 250000000
  save_frequency: 200
  save_best_after: 100
  on_existing: fail
  checkpoint: {mode: none, path: ''}
  wandb:
    enabled: false
    project: simtoolreal-connectome
    entity: ''
    group: gaussian-lf-entropy1x-sigma3-all-neuron-readout-noaux-lowrank4-synaptic-plasticity
    tags: [malecns, all-neuron-readout, no-actor-value-loss, mlp-adapters, clipped-gaussian, sigma-3, leader-follower, entropy-1x, low-rank, rank-4, synaptic-plasticity, frozen-intrinsic-dynamics]
  overrides:
    # Exact actor-LR/scheduler contract from the historical all-neuron noaux run.
    train.params.config.kl_threshold: 0.004
    train.params.config.learning_rate: 0.0001
    train.params.config.lr_schedule: adaptive
    train.params.config.schedule_type: standard
    train.params.config.min_lr: 0.000001
    train.params.config.max_lr: 0.001
    train.params.config.central_value_config.learning_rate: 0.0001
    train.params.config.use_others_experience: lf
    train.params.config.off_policy_ratio: 1.0
    ++train.params.config.use_experimental_cv: false
    ++train.params.network.connectome.dynamics.neural_updates: 4
    ++task.env.useSparseReward: false
    task.env.objectScaleNoiseMultiplierRange: [0.9, 1.1]
    task.env.forceConsecutiveNearGoalSteps: true
    train.params.config.expl_reward_coef_scale: 0.005
    task.env.forceScale: 2.0
    task.env.forceProbRange: [0.001, 0.1]
    task.env.forceDecay: 0.99
    task.env.forceDecayInterval: 0.08
    task.env.forceOnlyWhenLifted: true
    task.env.torqueScale: 0.0
    task.env.linVelImpulseScale: 0.0
    task.env.angVelImpulseScale: 0.0
    task.env.goodResetBoundary: 0
    train.params.config.good_reset_boundary: 0
