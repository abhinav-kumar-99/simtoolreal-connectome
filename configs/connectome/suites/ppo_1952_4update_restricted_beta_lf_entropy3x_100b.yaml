# Fresh restricted-Beta LF candidate with threefold SAPG entropy weights on GPU 0.
schema_version: 1
name: ppo_1952_4update_restricted_beta_lf_entropy3x_100b
stages: [prepare, train]
output_directory: train_dir/connectome/adaptation_100b_gains_update_timing/ppo_1952_4update_restricted_beta_lf_entropy3x_100b
runtime_environment:
  CC: /usr/bin/gcc
  CXX: /usr/bin/g++
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
preparation:
  config: configs/connectome/malecns_1952.yaml
training:
  task_profile: SimToolRealLSTMAsymmetric
  train_profiles:
    - {name: restricted_beta_lf_entropy3x, train_profile: SimToolRealConnectome1952AdaptersMLPBetaSAPG}
  seeds: [42]
  gpu_assignments: [0]
  max_parallel: 1
  num_envs: 12288
  sapg_block_size: 2048
  epochs: 508626
  max_frames: 100000000000
  minibatch_size: 49152
  central_critic_minibatch_size: 49152
  rollout_accumulation_steps: 1
  actor_microbatch_size: 49152
  central_critic_microbatch_size: 49152
  inference_checkpoint_interval_frames: 250000000
  save_frequency: 200
  save_best_after: 100
  on_existing: fail
  checkpoint: {mode: none, path: ''}
  wandb:
    enabled: false
    project: simtoolreal-connectome
    entity: ''
    group: restricted-beta-lf-entropy3x
    tags: [malecns, restricted-beta, leader-follower, entropy-3x, actor-value-loss]
  overrides:
    train.params.config.kl_threshold: 0.004
    train.params.config.learning_rate: 0.0001
    train.params.config.max_lr: 0.001
    train.params.config.use_others_experience: lf
    train.params.config.off_policy_ratio: 1.0
    ++train.params.config.use_experimental_cv: true
    ++train.params.network.connectome.dynamics.neural_updates: 4
    ++train.params.network.space.continuous.beta_min_shape: 1.0
    ++task.env.useSparseReward: false
    task.env.objectScaleNoiseMultiplierRange: [0.9, 1.1]
    task.env.forceConsecutiveNearGoalSteps: true
    train.params.config.expl_reward_coef_scale: 0.015
    task.env.forceScale: 2.0
    task.env.forceProbRange: [0.001, 0.1]
    task.env.forceDecay: 0.99
    task.env.forceDecayInterval: 0.08
    task.env.forceOnlyWhenLifted: true
    task.env.torqueScale: 0.0
    task.env.linVelImpulseScale: 0.0
    task.env.angVelImpulseScale: 0.0
    task.env.objectAngVelPenaltyScale: 0.0
    task.env.goodResetBoundary: 0
    train.params.config.good_reset_boundary: 0
