# One capped pilot per adaptation profile. Each child exactly preserves the
# published single-GPU SimToolReal SAPG batch geometry; two children run at once.
schema_version: 1
name: adaptation_1m_triton_12k
stages: [prepare, train]
output_directory: train_dir/connectome/adaptation_1m_triton_12k
runtime_environment:
  CC: /usr/bin/gcc
  CXX: /usr/bin/g++
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
preparation:
  config: configs/connectome/malecns_4310.yaml
training:
  task_profile: SimToolRealLSTMAsymmetric
  train_profiles:
    - {name: adapters_only, train_profile: SimToolRealConnectomeSAPG}
    - {name: neuron_gains, train_profile: SimToolRealConnectomeGainsSAPG}
    - {name: low_rank_r4, train_profile: SimToolRealConnectomeLowRankSAPG}
    - {name: edgewise, train_profile: SimToolRealConnectomeEdgewiseSAPG}
    - {name: gains_dynamics, train_profile: SimToolRealConnectomeGainsDynamicsSAPG}
  seeds: [42]
  gpu_assignments: [0, 1]
  max_parallel: 2
  # The connectome plus asymmetric critic does not fit the paper's 24,576-env
  # shape in 24 GB. These three sizes are scaled together by two, preserving
  # six SAPG blocks and four minibatches per epoch.
  num_envs: 12288
  sapg_block_size: 2048
  # 12,288 envs x horizon 16 x 5 complete epochs = 983,040 steps.
  epochs: 5
  max_frames: 1000000
  minibatch_size: 49152
  central_critic_minibatch_size: 49152
  save_frequency: 3000
  save_best_after: 100
  on_existing: fail
  checkpoint: {mode: none, path: ''}
  wandb: {enabled: false, project: simtoolreal-connectome, entity: '', group: adaptation_1m_triton_12k, tags: [malecns, adaptation, triton, one-million-cap]}
  overrides:
    ++task.env.useSparseReward: false
    task.env.objectScaleNoiseMultiplierRange: [0.9, 1.1]
    task.env.forceConsecutiveNearGoalSteps: true
    task.env.forceScale: 20.0
    task.env.torqueScale: 2.0
    task.env.objectAngVelPenaltyScale: 0.0
    task.env.goodResetBoundary: 0
    train.params.config.good_reset_boundary: 0
