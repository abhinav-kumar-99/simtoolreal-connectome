# Fresh CUDA:1 rerun of the no-auxiliary all-neuron actor at 7B.
# Keep the output directory distinct so completed cases are not reused.
schema_version: 1
output_directory: evals/connectome/anatomical_1952_7b_noaux_dual_tolerance_hd_cuda1
runtime_environment:
  CC: /usr/bin/gcc
  CXX: /usr/bin/g++
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
policy_sources:
  gaussian_lf_entropy1x_sigma3_all_neurons_noaux:
    checkpoint_path: train_dir/connectome/adaptation_100b_gains_update_timing/ppo_1952_4update_gaussian_lf_entropy1x_sigma3_all_neuron_readout_noaux_100b/00_ppo_1952_4update_gaussian_lf_entropy1x_sigma3_all_neuron_readout_noaux_100b_gaussian_lf_entropy1x_sigma3_all_neurons_noaux_seed42/rl_runs/00_ppo_1952_4update_gaussian_lf_entropy1x_sigma3_all_neuron_readout_noaux_100b_gaussian_lf_entropy1x_sigma3_all_neurons_noaux_seed42/nn/milestone_target_007000000000_actual_007000031232_ep_035604.pth
    policy_config_path: train_dir/connectome/adaptation_100b_gains_update_timing/ppo_1952_4update_gaussian_lf_entropy1x_sigma3_all_neuron_readout_noaux_100b/00_ppo_1952_4update_gaussian_lf_entropy1x_sigma3_all_neuron_readout_noaux_100b_gaussian_lf_entropy1x_sigma3_all_neurons_noaux_seed42/resolved_config.yaml
policies: [gaussian_lf_entropy1x_sigma3_all_neurons_noaux]
gpu_assignments: [1]
max_parallel: 1
episodes_per_case: 1
action_selection: mean
downsample_factor: 1
z_offset: 0.03
max_steps: 601
table_urdf: urdf/table_narrow.urdf
metrics:
  paper_task_progress:
    success_tolerance_m: 0.02
  checkpoint_training_tolerance:
    success_tolerance_m: 0.039858076721429825
    resolved_from_checkpoint_frame: 7000031232
    resolved_from_tensorboard_tag: scalars/success_tolerance/frame
videos:
  metrics: [paper_task_progress, checkpoint_training_tolerance]
  fps: 20
  frame_interval: 3
  camera_resolution_reduction_factor: 1
  video_quality: 9
  circuit:
    enabled: true
    fps_multiplier: 4
    group_labels: true
    leg_shadows: true
    activity_bars: true
    robot_crop: [0.30, 0.06, 0.70, 0.88]
    robot_panel_fraction: 0.40
    overview_panel_fraction: 0.65
    resolution: [1920, 1080]
    geometry_cache: data/connectomes/geometry/malecns_v1
    annotations_path: data/connectomes/raw/malecns_v1_audit/annotations.feather
    projection: [x, z]
    vnc_bounds_um: [240, 560, 400, 1100]
    outputs: [circuit, combined]
eval_cases:
  - {object_category: marker, object_name: sharpie_marker, task_name: write_c}
  - {object_category: eraser, object_name: flat_eraser, task_name: wipe_smile}
  - {object_category: spatula, object_name: flat_spatula, task_name: flip_over}
  - {object_category: brush, object_name: blue_brush, task_name: sweep_forward}
  - {object_category: brush, object_name: blue_brush, task_name: sweep_right}
