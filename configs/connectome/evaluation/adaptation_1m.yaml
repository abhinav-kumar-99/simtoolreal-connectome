schema_version: 1
training_suite_directory: train_dir/connectome/adaptation_1m_triton_12k
output_directory: evals/connectome/adaptation_1m_triton_12k
runtime_environment:
  CC: /usr/bin/gcc
  CXX: /usr/bin/g++
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
policies: [adapters_only, neuron_gains, low_rank_r4, edgewise, gains_dynamics]
gpu_assignments: [0, 1]
max_parallel: 2
episodes_per_case: 1
action_selection: mean
downsample_factor: 1
z_offset: 0.03
max_steps: 601
table_urdf: urdf/table_narrow.urdf
metrics:
  paper_task_progress:
    success_tolerance_m: 0.02
  repository_avg_goal_pct:
    success_tolerance_m: 0.01
videos:
  metric: paper_task_progress
  fps: 10
  frame_interval: 6
eval_cases:
  - {object_category: hammer, object_name: claw_hammer, task_name: swing_down}
  - {object_category: screwdriver, object_name: long_screwdriver, task_name: spin_vertical}
  - {object_category: brush, object_name: blue_brush, task_name: sweep_forward}
