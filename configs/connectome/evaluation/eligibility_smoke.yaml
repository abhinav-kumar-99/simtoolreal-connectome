schema_version: 1
training_suite_name: eligibility_smoke
training_suite_directory: train_dir/connectome/adaptation_100b_gains_update_timing/eligibility_smoke
output_directory: evals/connectome/eligibility_smoke
max_frames: 3072
milestone_interval_frames: 1536
poll_interval_seconds: 1
watch_until_complete: false
policies:
  - name: local_td
    seed: 42
    gpu: 0
    policy_config_path: train_dir/connectome/adaptation_100b_gains_update_timing/eligibility_smoke/00_eligibility_smoke_local_td_seed42/resolved_config.yaml
evaluation:
  runtime_environment:
    CC: /usr/bin/gcc
    CXX: /usr/bin/g++
    OMP_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'
  episodes_per_case: 1
  action_selection: mean
  downsample_factor: 1
  z_offset: 0.03
  max_steps: 30
  table_urdf: urdf/table_narrow.urdf
  metrics:
    paper_task_progress:
      success_tolerance_m: 0.02
  videos:
    metric: paper_task_progress
    fps: 20
    frame_interval: 1
    camera_resolution_reduction_factor: 2
  eval_cases:
    - {object_category: marker, object_name: sharpie_marker, task_name: write_c}
