# Three deterministic videos for each no-auxiliary-value reservoir milestone.
schema_version: 1
training_suite_name: ppo_1952_fixed_reservoir_rot6d_gaussian_lf_entropy1x_sigma3_noaux_100b
training_suite_directory: train_dir/connectome/fixed_reservoir/ppo_1952_fixed_reservoir_rot6d_gaussian_lf_entropy1x_sigma3_noaux_100b
output_directory: evals/connectome/ppo_1952_fixed_reservoir_rot6d_gaussian_lf_entropy1x_sigma3_noaux_100b_milestones
max_frames: 100000000000
milestone_interval_frames: 250000000
poll_interval_seconds: 30
watch_until_complete: true
policies:
  - name: fixed_reservoir_gaussian_noaux
    seed: 42
    gpu: 1
    policy_config_path: train_dir/connectome/fixed_reservoir/ppo_1952_fixed_reservoir_rot6d_gaussian_lf_entropy1x_sigma3_noaux_100b/00_ppo_1952_fixed_reservoir_rot6d_gaussian_lf_entropy1x_sigma3_noaux_100b_fixed_reservoir_gaussian_noaux_seed42/resolved_config.yaml
evaluation:
  runtime_environment:
    CC: /usr/bin/gcc
    CXX: /usr/bin/g++
    OMP_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'
  episodes_per_case: 1
  action_selection: mean
  downsample_factor: 1
  z_offset: 0.03
  max_steps: 601
  table_urdf: urdf/table_narrow.urdf
  metrics:
    paper_task_progress:
      success_tolerance_m: 0.02
  videos:
    metric: paper_task_progress
    fps: 20
    frame_interval: 3
    camera_resolution_reduction_factor: 2
  eval_cases:
    - {object_category: marker, object_name: sharpie_marker, task_name: write_c}
    - {object_category: eraser, object_name: flat_eraser, task_name: wipe_smile}
    - {object_category: spatula, object_name: flat_spatula, task_name: flip_over}
