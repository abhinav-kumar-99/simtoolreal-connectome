# Watcher for the 12,288-environment memory-preserving fallback only.
schema_version: 1
training_suite_name: ppo_official_repo_lstm_sapg_seed42_memory_preserving
training_suite_directory: train_dir/connectome/official_lstm/ppo_official_repo_lstm_sapg_seed42_memory_preserving
output_directory: evals/connectome/ppo_official_repo_lstm_sapg_seed42_memory_preserving_milestones
max_frames: 393216000000
milestone_interval_frames: 250000000
poll_interval_seconds: 30
watch_until_complete: true
policies:
  - name: official_lstm_sapg
    seed: 42
    gpu: 1
    policy_config_path: train_dir/connectome/official_lstm/ppo_official_repo_lstm_sapg_seed42_memory_preserving/00_ppo_official_repo_lstm_sapg_seed42_memory_preserving_official_lstm_sapg_seed42/resolved_config.yaml
evaluation:
  runtime_environment:
    CC: /usr/bin/gcc
    CXX: /usr/bin/g++
    OMP_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'
  episodes_per_case: 1
  action_selection: mean
  downsample_factor: 1
  z_offset: 0.03
  max_steps: 601
  table_urdf: urdf/table_narrow.urdf
  metrics:
    paper_task_progress:
      success_tolerance_m: 0.02
  videos:
    metric: paper_task_progress
    fps: 20
    frame_interval: 3
    camera_resolution_reduction_factor: 2
  eval_cases:
    - {object_category: marker, object_name: sharpie_marker, task_name: write_c}
    - {object_category: eraser, object_name: flat_eraser, task_name: wipe_smile}
    - {object_category: spatula, object_name: flat_spatula, task_name: flip_over}
