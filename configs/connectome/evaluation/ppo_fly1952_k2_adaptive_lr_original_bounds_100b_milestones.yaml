# Dual-tolerance milestones for K=2 with the original adaptive LR bounds.
schema_version: 1
training_suite_name: ppo_fly1952_k2_adaptive_lr_original_bounds_100b
training_suite_directory: train_dir/connectome/cycle_ablation/ppo_fly1952_k2_adaptive_lr_original_bounds_100b
output_directory: evals/connectome/ppo_fly1952_k2_adaptive_lr_original_bounds_100b_milestones
max_frames: 100000000000
milestone_interval_frames: 250000000
poll_interval_seconds: 30
watch_until_complete: true
policies:
  - name: fly1952_k2_adaptive_lr_original_bounds
    seed: 42
    gpu: 1
    policy_config_path: train_dir/connectome/cycle_ablation/ppo_fly1952_k2_adaptive_lr_original_bounds_100b/00_ppo_fly1952_k2_adaptive_lr_original_bounds_100b_fly1952_k2_adaptive_lr_original_bounds_seed42/resolved_config.yaml
evaluation:
  runtime_environment:
    CC: /usr/bin/gcc
    CXX: /usr/bin/g++
    OMP_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'
  episodes_per_case: 1
  action_selection: mean
  downsample_factor: 1
  z_offset: 0.03
  max_steps: 601
  table_urdf: urdf/table_narrow.urdf
  metrics:
    paper_task_progress:
      success_tolerance_m: 0.02
    checkpoint_training_tolerance:
      success_tolerance_source: checkpoint_tensorboard
      success_tolerance_tag: scalars/success_tolerance/frame
  videos:
    metrics: [paper_task_progress, checkpoint_training_tolerance]
    fps: 20
    frame_interval: 3
    camera_resolution_reduction_factor: 2
  eval_cases:
    - {object_category: marker, object_name: sharpie_marker, task_name: write_c}
    - {object_category: eraser, object_name: flat_eraser, task_name: wipe_smile}
    - {object_category: spatula, object_name: flat_spatula, task_name: flip_over}
