# Dual-tolerance milestone videos for the rollout-KL matched actor pair.
schema_version: 1
training_suite_name: ppo_lstm323_fly1952_asymmetric_noaux_mlp128x32x32_rollout_kl_100b
training_suite_directory: train_dir/connectome/asymmetric_pair/ppo_lstm323_fly1952_asymmetric_noaux_mlp128x32x32_rollout_kl_100b
output_directory: evals/connectome/ppo_lstm323_fly1952_asymmetric_noaux_mlp128x32x32_rollout_kl_100b_milestones
max_frames: 100000000000
milestone_interval_frames: 250000000
poll_interval_seconds: 30
watch_until_complete: true
policies:
  - name: lstm323_matched_asymmetric_mlp
    seed: 42
    gpu: 0
    policy_config_path: train_dir/connectome/asymmetric_pair/ppo_lstm323_fly1952_asymmetric_noaux_mlp128x32x32_rollout_kl_100b/00_ppo_lstm323_fly1952_asymmetric_noaux_mlp128x32x32_rollout_kl_100b_lstm323_matched_asymmetric_mlp_seed42/resolved_config.yaml
  - name: fly1952_asymmetric_mlp128x32x32
    seed: 42
    gpu: 1
    policy_config_path: train_dir/connectome/asymmetric_pair/ppo_lstm323_fly1952_asymmetric_noaux_mlp128x32x32_rollout_kl_100b/00_ppo_lstm323_fly1952_asymmetric_noaux_mlp128x32x32_rollout_kl_100b_fly1952_asymmetric_mlp128x32x32_seed42/resolved_config.yaml
evaluation:
  runtime_environment:
    CC: /usr/bin/gcc
    CXX: /usr/bin/g++
    OMP_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'
  episodes_per_case: 1
  action_selection: mean
  downsample_factor: 1
  z_offset: 0.03
  max_steps: 601
  table_urdf: urdf/table_narrow.urdf
  metrics:
    paper_task_progress:
      success_tolerance_m: 0.02
    checkpoint_training_tolerance:
      success_tolerance_source: checkpoint_tensorboard
      success_tolerance_tag: scalars/success_tolerance/frame
  videos:
    metrics: [paper_task_progress, checkpoint_training_tolerance]
    fps: 20
    frame_interval: 3
    camera_resolution_reduction_factor: 2
  eval_cases:
    - {object_category: marker, object_name: sharpie_marker, task_name: write_c}
    - {object_category: eraser, object_name: flat_eraser, task_name: wipe_smile}
    - {object_category: spatula, object_name: flat_spatula, task_name: flip_over}
