# Predeclared seed-42 comparison at the common 5B-frame milestone.
schema_version: 1
output_directory: evals/connectome/ppo_1952_fly_lstm_matched_5b_all_tasks
policy_sources:
  fly_all_neuron:
    training_suite_name: ppo_1952_4update_gaussian_lf_entropy1x_sigma3_all_neuron_readout_100b
    training_suite_directory: train_dir/connectome/adaptation_100b_gains_update_timing/ppo_1952_4update_gaussian_lf_entropy1x_sigma3_all_neuron_readout_100b
    policy_name: gaussian_lf_entropy1x_sigma3_all_neurons
    seed: 42
    milestone_target_frame: 5000000000
  lstm323_matched:
    training_suite_name: ppo_lstm323_matched_gaussian_lf_entropy1x_sigma3_100b
    training_suite_directory: train_dir/connectome/lstm_baseline/ppo_lstm323_matched_gaussian_lf_entropy1x_sigma3_100b
    policy_name: lstm323_matched
    seed: 42
    milestone_target_frame: 5000000000
policies: [fly_all_neuron, lstm323_matched]
gpu_assignments: [0, 1]
max_parallel: 2
runtime_environment:
  CC: /usr/bin/gcc
  CXX: /usr/bin/g++
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
episodes_per_case: 1
action_selection: mean
downsample_factor: 1
z_offset: 0.03
max_steps: 601
table_urdf: urdf/table_narrow.urdf
metrics:
  paper_task_progress:
    success_tolerance_m: 0.02
videos:
  # Deliberately unmatched so the 48-case metric run does not render videos.
  metric: none
  fps: 20
  frame_interval: 3
  camera_resolution_reduction_factor: 2
eval_cases:
  - {object_category: brush, object_name: blue_brush, task_name: sweep_forward}
  - {object_category: brush, object_name: blue_brush, task_name: sweep_right}
  - {object_category: brush, object_name: red_brush, task_name: sweep_forward}
  - {object_category: brush, object_name: red_brush, task_name: sweep_right}
  - {object_category: eraser, object_name: flat_eraser, task_name: wipe_c}
  - {object_category: eraser, object_name: flat_eraser, task_name: wipe_smile}
  - {object_category: eraser, object_name: handle_eraser, task_name: wipe_c}
  - {object_category: eraser, object_name: handle_eraser, task_name: wipe_smile}
  - {object_category: hammer, object_name: claw_hammer, task_name: swing_down}
  - {object_category: hammer, object_name: claw_hammer, task_name: swing_side}
  - {object_category: hammer, object_name: mallet_hammer, task_name: swing_down}
  - {object_category: hammer, object_name: mallet_hammer, task_name: swing_side}
  - {object_category: marker, object_name: sharpie_marker, task_name: draw_smile}
  - {object_category: marker, object_name: sharpie_marker, task_name: write_c}
  - {object_category: marker, object_name: staples_marker, task_name: draw_smile}
  - {object_category: marker, object_name: staples_marker, task_name: write_c}
  - {object_category: screwdriver, object_name: long_screwdriver, task_name: spin_horizontal}
  - {object_category: screwdriver, object_name: long_screwdriver, task_name: spin_vertical}
  - {object_category: screwdriver, object_name: short_screwdriver, task_name: spin_horizontal}
  - {object_category: screwdriver, object_name: short_screwdriver, task_name: spin_vertical}
  - {object_category: spatula, object_name: flat_spatula, task_name: flip_over}
  - {object_category: spatula, object_name: flat_spatula, task_name: serve_plate}
  - {object_category: spatula, object_name: spoon_spatula, task_name: flip_over}
  - {object_category: spatula, object_name: spoon_spatula, task_name: serve_plate}
