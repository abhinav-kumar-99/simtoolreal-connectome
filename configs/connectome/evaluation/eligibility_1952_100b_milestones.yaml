# Three deterministic videos for every 250M-frame eligibility milestone.
schema_version: 1
training_suite_name: eligibility_1952_100b
training_suite_directory: train_dir/connectome/adaptation_100b_gains_update_timing/eligibility_1952_100b
output_directory: evals/connectome/eligibility_1952_100b_milestones
# Training takes one final 384-environment vector step past 100B. The watcher
# intentionally targets the exact 250M grid through 100B, not that extra step.
max_frames: 100000000000
milestone_interval_frames: 250000000
poll_interval_seconds: 30
watch_until_complete: true
policies:
  - name: adapters_gains_local_td
    seed: 42
    gpu: 0
    policy_config_path: train_dir/connectome/adaptation_100b_gains_update_timing/eligibility_1952_100b/00_eligibility_1952_100b_adapters_gains_local_td_seed42/resolved_config.yaml
evaluation:
  runtime_environment:
    CC: /usr/bin/gcc
    CXX: /usr/bin/g++
    OMP_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'
  episodes_per_case: 1
  action_selection: mean
  downsample_factor: 1
  z_offset: 0.03
  max_steps: 601
  table_urdf: urdf/table_narrow.urdf
  metrics:
    paper_task_progress:
      success_tolerance_m: 0.02
  videos:
    metric: paper_task_progress
    fps: 20
    frame_interval: 3
    camera_resolution_reduction_factor: 2
  eval_cases:
    - {object_category: marker, object_name: sharpie_marker, task_name: write_c}
    - {object_category: eraser, object_name: flat_eraser, task_name: wipe_smile}
    - {object_category: spatula, object_name: flat_spatula, task_name: flip_over}
