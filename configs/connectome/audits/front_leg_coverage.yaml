schema_version: 1
# Audit only: no actor artifact is rewritten and no training is launched.
dataset: male-cns:v1.0
source_page: https://male-cns.janelia.org/download/
current_config: configs/connectome/malecns_4310.yaml
output_directory: profiles/connectome/front_leg_coverage
download_missing: true
sources:
  annotations:
    path: data/connectomes/raw/malecns_v1_audit/annotations.feather
    url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather
    sha256: 2177e246113e4cfbf1e7772ec37c6da1955ff22e8063d0b1f833101f99a9a3b2
  partners:
    path: data/connectomes/raw/malecns_v1_audit/partners.feather
    url: https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/syn-partners-male-cns-v1.0-minconf-0.5.feather
    sha256: 959d8ef4173b35382a3e6acfaf5167c795b6d10b877572d146af04e1b487bc07
selection:
  status: Traced
  sensory_superclasses: [vnc_sensory, sensory_ascending]
  front_entry_nerves: [ProLN, ProAN, DProN, VProN]
  proprioceptive_class: mechanosensory_proprioceptive
  tactile_class: mechanosensory_tactile
  motor_superclass: vnc_motor
  motor_subclass: fl
  soma_neuromere: T1
  # Broad candidate lineages, NOT cell-level functional identifications.
  coordination_hemilineages: [13A, 13B, 09A, 23B]
  descending_type_regex: '^DNg(?:11|12)(?:_|$)'
connectivity:
  minimum_synapses: 5
  minimum_confidence: 0.5
  # Exact primary_post compartments; exclude brain, cervical connective,
  # and peripheral nerves. This explicit audit scope is not assumed equal
  # to the upstream extraction's unspecified neuPrint ROI query.
  primary_post_rois:
    - ANm
    - CRN
    - HTct(UTct-T3)(L)
    - HTct(UTct-T3)(R)
    - IntTct
    - LTct
    - LegNp(T1)(L)
    - LegNp(T1)(R)
    - LegNp(T2)(L)
    - LegNp(T2)(R)
    - LegNp(T3)(L)
    - LegNp(T3)(R)
    - NTct(UTct-T1)(L)
    - NTct(UTct-T1)(R)
    - Ov(L)
    - Ov(R)
    - WTct(UTct-T2)(L)
    - WTct(UTct-T2)(R)
    - mVAC(T1)(L)
    - mVAC(T1)(R)
    - mVAC(T2)(L)
    - mVAC(T2)(R)
    - mVAC(T3)(L)
    - mVAC(T3)(R)
    - VNC-unspecified
  reachability_hops: 4
  top_missing_partners: 30
