# Compare fresh candidates to the fixed 1x LF policy at 1.25G frames.
schema_version: 1
output_directory: train_dir/connectome/adaptation_100b_gains_update_timing/lf_entropy_success_handoff
poll_interval_seconds: 30
shutdown_timeout_seconds: 60
comparison:
  tag: mean_successes/frame
  target_step: 1250000000
  point_selection: closest_after_crossing
  comparator: strict_less
reference:
  name: restricted_beta_lf_entropy1x
  event_glob: train_dir/connectome/adaptation_100b_gains_update_timing/ppo_1952_4update_restricted_beta_lf_100b/00_ppo_1952_4update_restricted_beta_lf_100b_restricted_beta_lf_seed42/rl_runs/00_ppo_1952_4update_restricted_beta_lf_100b_restricted_beta_lf_seed42/summaries/events.out.tfevents.*
stages:
  - name: restricted_beta_lf_entropy5x
    event_glob: train_dir/connectome/adaptation_100b_gains_update_timing/ppo_1952_4update_restricted_beta_lf_entropy5x_100b/00_ppo_1952_4update_restricted_beta_lf_entropy5x_100b_restricted_beta_lf_entropy5x_seed42/rl_runs/00_ppo_1952_4update_restricted_beta_lf_entropy5x_100b_restricted_beta_lf_entropy5x_seed42/summaries/events.out.tfevents.*
    stop_process_markers:
      - scripts/run_connectome_suite.py --config configs/connectome/suites/ppo_1952_4update_restricted_beta_lf_entropy5x_100b.yaml
      - experiment=00_ppo_1952_4update_restricted_beta_lf_entropy5x_100b_restricted_beta_lf_entropy5x_seed42
      - scripts/run_connectome_milestone_evaluation.py --config configs/connectome/evaluation/ppo_1952_4update_restricted_beta_lf_entropy5x_100b_milestones.yaml
    replacement:
      stage: restricted_beta_lf_entropy3x
      training_config: configs/connectome/suites/ppo_1952_4update_restricted_beta_lf_entropy3x_100b.yaml
      video_config: configs/connectome/evaluation/ppo_1952_4update_restricted_beta_lf_entropy3x_100b_milestones.yaml
      trainer_process_marker: experiment=00_ppo_1952_4update_restricted_beta_lf_entropy3x_100b_restricted_beta_lf_entropy3x_seed42
      startup_timeout_seconds: 120
  - name: restricted_beta_lf_entropy3x
    event_glob: train_dir/connectome/adaptation_100b_gains_update_timing/ppo_1952_4update_restricted_beta_lf_entropy3x_100b/00_ppo_1952_4update_restricted_beta_lf_entropy3x_100b_restricted_beta_lf_entropy3x_seed42/rl_runs/00_ppo_1952_4update_restricted_beta_lf_entropy3x_100b_restricted_beta_lf_entropy3x_seed42/summaries/events.out.tfevents.*
    stop_process_markers:
      - scripts/run_connectome_suite.py --config configs/connectome/suites/ppo_1952_4update_restricted_beta_lf_entropy3x_100b.yaml
      - experiment=00_ppo_1952_4update_restricted_beta_lf_entropy3x_100b_restricted_beta_lf_entropy3x_seed42
      - scripts/run_connectome_milestone_evaluation.py --config configs/connectome/evaluation/ppo_1952_4update_restricted_beta_lf_entropy3x_100b_milestones.yaml
    replacement:
      stage: gaussian_lf_entropy3x_sigma3
      training_config: configs/connectome/suites/ppo_1952_4update_gaussian_lf_entropy3x_sigma3_100b.yaml
      video_config: configs/connectome/evaluation/ppo_1952_4update_gaussian_lf_entropy3x_sigma3_100b_milestones.yaml
      trainer_process_marker: experiment=00_ppo_1952_4update_gaussian_lf_entropy3x_sigma3_100b_gaussian_lf_entropy3x_sigma3_seed42
      startup_timeout_seconds: 120
      terminal: true
